<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microbial Cell</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f8a4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Microbial Cell">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f8f5;--card:#fff;--tx:#14301f;--mut:#5b7466;--ac:#1f8a4c;--ac2:#e6f4ea;--bd:#d5e3da;--warn:#c2410c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#17261d;--tx:#e6f2ea;--mut:#9ab5a5;--ac:#4ade80;--ac2:#1d3326;--bd:#2a4234;--warn:#fb923c}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#17261d;--tx:#e6f2ea;--mut:#9ab5a5;--ac:#4ade80;--ac2:#1d3326;--bd:#2a4234;--warn:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,'Segoe UI',Arial,sans-serif;line-height:1.8}
.wrap{max-width:860px;margin:auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:12px}
.card h2{margin:0 0 6px;font-size:1.15rem}
svg{width:100%;height:auto;display:block}
.info{background:var(--ac2);border-radius:10px;padding:12px;margin-top:10px;min-height:88px}
.org{cursor:pointer;transition:opacity .2s}.org:hover{opacity:.8}.org.sel{stroke:var(--tx);stroke-width:3}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--ac);background:var(--card);color:var(--ac);font:inherit;padding:8px 16px;border-radius:10px;cursor:pointer}
.btn.p{background:var(--ac);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;font:inherit;font-family:monospace;direction:ltr;text-align:left;letter-spacing:2px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.codons{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;direction:ltr}
.cd{border:1px solid var(--bd);border-radius:8px;padding:4px 8px;text-align:center;font-family:monospace;min-width:54px}
.cd b{display:block;color:var(--ac)}.cd.stop b{color:var(--warn)}.cd small{color:var(--mut);font-family:Tahoma,Arial,sans-serif}
.q{margin:10px 0}.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{background:#16a34a;color:#fff;border-color:#16a34a}.opt.no{background:#dc2626;color:#fff;border-color:#dc2626}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--ac)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1 dir="ltr">🧬 Microbial Cell</h1>
<p class="sub">دروس تفاعلية: الخلية، الانقسام الميتوزي، والتعبير الجيني</p>
<nav id="nav"></nav>

<section id="s0" class="card">
<h2>الخلية حقيقية النواة</h2>
<p class="sub">اضغط على أي عضية لتعرف تركيبها ووظيفتها.</p>
<svg viewBox="0 0 400 260" id="cell" role="img" aria-label="رسم خلية">
<ellipse class="org" data-k="mem" cx="200" cy="130" rx="190" ry="120" fill="#fde68a" stroke="#b45309" stroke-width="4"/>
<ellipse class="org" data-k="nuc" cx="190" cy="125" rx="52" ry="44" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="190" cy="125" r="12" fill="#1e3a8a"/>
<path class="org" data-k="er" d="M255 95 q25 -10 40 5 q-20 8 -40 12 q25 6 38 22 q-25 -2 -42 -8 z" fill="#f9a8d4" stroke="#be185d" stroke-width="2"/>
<g class="org" data-k="mito"><ellipse cx="110" cy="175" rx="30" ry="15" fill="#fca5a5" stroke="#b91c1c" stroke-width="2" transform="rotate(-20 110 175)"/><path d="M92 178 q8 -10 14 0 t14 -2" stroke="#b91c1c" fill="none" stroke-width="2"/></g>
<g class="org" data-k="golgi"><path d="M290 175 q25 -8 50 0" stroke="#7c3aed" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M293 188 q22 -8 44 0" stroke="#7c3aed" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M296 201 q19 -8 38 0" stroke="#7c3aed" stroke-width="7" fill="none" stroke-linecap="round"/></g>
<circle class="org" data-k="lyso" cx="120" cy="80" r="14" fill="#86efac" stroke="#15803d" stroke-width="2"/>
<g class="org" data-k="ribo" fill="#334155"><circle cx="230" cy="190" r="4"/><circle cx="244" cy="200" r="4"/><circle cx="222" cy="208" r="4"/><circle cx="252" cy="182" r="4"/></g>
</svg>
<div class="info" id="orgInfo">اختر عضية من الرسم.</div>
</section>

<section id="s1" class="card hide">
<h2>الانقسام الميتوزي</h2>
<svg viewBox="0 0 400 220" id="mit"></svg>
<div class="dots" id="mdots"></div>
<div class="info" id="mInfo"></div>
<div class="btns"><button class="btn" id="mp">السابق</button><button class="btn p" id="mn">التالي</button></div>
</section>

<section id="s2" class="card hide">
<h2>من DNA إلى بروتين</h2>
<p class="sub">اكتب تتابع الشريط القالب لـ DNA (حروف A T G C فقط) وشاهد النسخ والترجمة.</p>
<input type="text" id="dna" value="TACGGTCATTTCATT" maxlength="60" aria-label="تتابع DNA">
<div class="btns"><button class="btn" id="rnd">تتابع عشوائي</button></div>
<div id="out"></div>
</section>

<section id="s3" class="card hide">
<h2>اختبر نفسك</h2>
<div id="quiz"></div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const tabs=['الخلية','الانقسام','DNA → بروتين','اختبار'];
tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(i);b.id='t'+i;$('nav').appendChild(b)});
function show(i){tabs.forEach((_,j)=>{$('s'+j).classList.toggle('hide',j!==i);$('t'+j).classList.toggle('on',j===i)});try{location.hash='l'+i}catch(e){}}
show(Math.max(0,Math.min(3,parseInt((location.hash||'').slice(2))||0)));

/* الخلية */
const orgs={
mem:['الغشاء البلازمي','طبقة فوسفوليبيدية مزدوجة بها بروتينات. تنظّم دخول المواد وخروجها (نفاذية اختيارية) وتستقبل الإشارات الخلوية.'],
nuc:['النواة','محاطة بغلاف نووي ذي مسام، وتحوي الكروماتين (DNA + هستونات) والنُّوَيّة. مركز التحكم وموقع النسخ.'],
er:['الشبكة الإندوبلازمية','الخشنة عليها ريبوسومات وتصنّع بروتينات الإفراز والأغشية، والملساء تصنّع الدهون وتُزيل السموم وتخزّن Ca²⁺.'],
mito:['الميتوكوندريا','غشاء خارجي وآخر داخلي مطوي (cristae). موقع دورة كريبس والفسفرة التأكسدية لإنتاج ATP، ولها DNA خاص.'],
golgi:['جهاز جولجي','أكياس مفلطحة تعدّل البروتينات (مثل الارتباط بالسكريات) وتفرزها وتوزعها في حويصلات.'],
lyso:['الليزوسوم','حويصلات بها إنزيمات هاضمة حمضية (pH≈5) تهضم الفضلات والعضيات التالفة.'],
ribo:['الريبوسومات','من rRNA وبروتينات (80S في حقيقيات النواة). موقع ترجمة mRNA إلى سلسلة ببتيدية.']};
document.querySelectorAll('.org').forEach(el=>el.onclick=()=>{
document.querySelectorAll('.org').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');
const [n,d]=orgs[el.dataset.k];$('orgInfo').innerHTML='<b>'+n+'</b><br>'+d});

/* الميتوزي */
const ph=[
['الطور البيني','تتضاعف المادة الوراثية في الطور S فيصبح كل كروموسوم من كروماتيدين شقيقين. النواة والغلاف النووي ظاهران.'],
['الطور التمهيدي','يتكثف الكروماتين إلى كروموسومات مرئية، تختفي النُّوَيّة، وتتكوّن خيوط المغزل من المريكزات.'],
['الطور الاستوائي','يتحلّل الغلاف النووي وتصطف الكروموسومات على خط الاستواء، وترتبط بخيوط المغزل عند السنترومير.'],
['الطور الانفصالي','ينفصل الكروماتيدان الشقيقان ويُسحب كل منهما إلى قطب مقابل بانكماش خيوط المغزل.'],
['الطور النهائي','يتكوّن غلاف نووي حول كل مجموعة، تتفكّك الكروموسومات، ثم يحدث انقسام السيتوبلازم لينتج خليتان متطابقتان.']];
let mi=0;
const X=(x,y,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r})" stroke-width="5" stroke-linecap="round"><path d="M-8 -12 L8 12" stroke="#dc2626"/><path d="M8 -12 L-8 12" stroke="#2563eb"/></g>`;
const V=(x,y,c)=>`<path d="M${x-3} ${y-10} L${x+3} ${y+10}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;
function drawM(){
const cell=(cx,cy,rx,ry)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>`;
const nuc=`<circle cx="200" cy="110" r="55" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" opacity=".85"/>`;
let s='';
if(mi==0){s=cell(200,110,100,90)+nuc+'<circle cx="200" cy="110" r="14" fill="#1e3a8a"/>';for(let i=0;i<4;i++)s+=`<path d="M${160+i*25} 80 q10 15 0 30 t5 30" stroke="#6366f1" fill="none" stroke-width="2"/>`}
if(mi==1){s=cell(200,110,100,90)+nuc;[[170,90,20],[215,85,-30],[190,120,70],[225,125,10],[165,125,-50]].forEach(a=>s+=X(...a))+'';s+='<circle cx="85" cy="110" r="5" fill="#0f766e"/><circle cx="315" cy="110" r="5" fill="#0f766e"/>'}
if(mi==2){s=cell(200,110,100,90)+'<path d="M85 110 L200 110 L315 110" stroke="#0f766e" stroke-dasharray="4 4"/>';[60,85,110,135,160].forEach(y=>s+=X(200,y))}
if(mi==3){s=cell(200,110,110,90);[70,95,120,145].forEach(y=>{s+=V(150,y,'#dc2626')+V(250,y,'#2563eb')});s+='<path d="M95 110 L150 95 M95 110 L150 125 M305 110 L250 95 M305 110 L250 125" stroke="#0f766e" stroke-dasharray="4 4"/>'}
if(mi==4){s='<ellipse cx="130" cy="110" rx="78" ry="75" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><ellipse cx="270" cy="110" rx="78" ry="75" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><circle cx="130" cy="110" r="38" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="270" cy="110" r="38" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>';[[115,100],[140,115],[125,125]].forEach(p=>s+=V(...p,'#dc2626'));[[255,100],[280,115],[265,125]].forEach(p=>s+=V(...p,'#2563eb'))}
$('mit').innerHTML=s;
$('mInfo').innerHTML='<b>'+(mi+1)+'. '+ph[mi][0]+'</b><br>'+ph[mi][1];
$('mdots').innerHTML=ph.map((_,i)=>'<i class="'+(i==mi?'on':'')+'"></i>').join('');
$('mp').disabled=mi==0;$('mn').disabled=mi==4}
$('mp').onclick=()=>{mi--;drawM()};$('mn').onclick=()=>{mi++;drawM()};drawM();

/* DNA → protein */
const B='UCAG',AA='FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const names={F:'Phe',L:'Leu',S:'Ser',Y:'Tyr','*':'Stop',C:'Cys',W:'Trp',P:'Pro',H:'His',Q:'Gln',R:'Arg',I:'Ile',M:'Met',T:'Thr',N:'Asn',K:'Lys',V:'Val',A:'Ala',D:'Asp',E:'Glu',G:'Gly'};
const comp={A:'U',T:'A',G:'C',C:'G'};
function run(){
const d=$('dna').value.toUpperCase().replace(/[^ATGC]/g,'');
const m=[...d].map(c=>comp[c]).join('');
let h='<div class="info"><b>mRNA (5’→3’):</b><br><span style="direction:ltr;display:block;font-family:monospace;letter-spacing:2px;word-break:break-all">'+(m||'—')+'</span></div><div class="codons">';
let stopped=false;
for(let i=0;i+3<=m.length;i+=3){const c=m.slice(i,i+3);const a=AA[16*B.indexOf(c[0])+4*B.indexOf(c[1])+B.indexOf(c[2])];
h+=`<div class="cd ${a=='*'?'stop':''}">${c}<b>${names[a]}</b><small>${a=='*'?'توقف':''}</small></div>`;if(a=='*'){stopped=true;break}}
h+='</div><p class="sub">'+(m.length<3?'اكتب 3 قواعد على الأقل.':stopped?'توقفت الترجمة عند كودون النهاية.':'لا يوجد كودون نهاية في هذا التتابع.')+' تذكّر: AUG هو كودون البدء ويشفّر ميثيونين.</p>';
$('out').innerHTML=h}
$('dna').oninput=run;
$('rnd').onclick=()=>{let s='TAC';for(let i=0;i<9;i++)s+='ATGC'[Math.random()*4|0];$('dna').value=s+'ATT';run()};run();

/* Quiz */
const Q=[
['أي عضية هي موقع الفسفرة التأكسدية؟',['الليزوسوم','الميتوكوندريا','جهاز جولجي','النُّوَيّة'],1],
['في أي طور من الميتوزي ينفصل الكروماتيدان الشقيقان؟',['التمهيدي','الاستوائي','الانفصالي','النهائي'],2],
['ما كودون البدء في mRNA؟',['UAA','AUG','UGA','GGG'],1],
['إذا كان الشريط القالب 3’-TAC-5’ فالكودون المقابل في mRNA هو:',['ATG','AUG','UAC','TUC'],1],
['أي عضية تحوي إنزيمات هاضمة حمضية؟',['الريبوسوم','الشبكة الملساء','الليزوسوم','الميتوكوندريا'],2]];
let qi=0,sc=0;
function rq(){
if(qi>=Q.length){$('quiz').innerHTML=`<div class="info"><b>نتيجتك: ${sc} من ${Q.length}</b><br>${sc>=4?'ممتاز! 🎉':'راجع الدروس وجرّب مرة أخرى.'}</div><div class="btns"><button class="btn p" id="rs">إعادة الاختبار</button></div>`;$('rs').onclick=()=>{qi=0;sc=0;rq()};return}
const q=Q[qi];$('quiz').innerHTML=`<div class="q"><b>السؤال ${qi+1}/${Q.length}</b><br>${q[0]}</div>`+q[1].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('');
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
const i=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
document.querySelector(`.opt[data-i="${q[2]}"]`).classList.add('ok');if(i==q[2])sc++;else b.classList.add('no');
setTimeout(()=>{qi++;rq()},1100)})}
rq();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
